<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Тренажёр новичка</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 900px;
      margin: 0 auto;
      padding: 24px;
    }

    button {
      padding: 10px 16px;
      margin: 6px;
      cursor: pointer;
    }

    .hidden {
      display: none;
    }

    .case-box {
      border: 1px solid #aaa;
      padding: 20px;
      margin-top: 20px;
    }

    .timer {
      font-size: 24px;
      font-weight: bold;
      margin: 16px 0;
    }

    .answer-box {
      margin-top: 16px;
      padding: 12px;
      border: 1px solid #ccc;
    }

    .stats {
      margin-top: 24px;
      border-top: 1px solid #ccc;
      padding-top: 16px;
    }
  </style>
</head>

<body>

  <h1>Тренажёр новичка</h1>

  <div id="home-screen">

    <h2>Практика поиска кнопок</h2>

    <button onclick="startTraining()">
      Начать тренировку
    </button>

    <div class="stats">
      <h3>Прогресс</h3>

      <p>
        Закреплено кейсов:
        <span id="interface-progress">0 / 10</span>
      </p>
    </div>

  </div>


  <div id="case-screen" class="hidden">

    <button onclick="goHome()">
      ← На главную
    </button>

    <div class="case-box">

      <div>
        Закрепление кейса:
        <span id="case-progress">0 / 3</span>
      </div>

      <div class="timer">
        Время:
        <span id="timer">0</span> сек.
      </div>

      <h3 id="case-question"></h3>

      <p>
        Выбери правильную кнопку:
      </p>

      <div id="interface-options"></div>

      <div
        id="result-box"
        class="answer-box hidden"
      ></div>

      <button
        id="next-case-btn"
        class="hidden"
        onclick="nextCase()"
      >
        Следующий кейс
      </button>

    </div>

  </div>


<script>

  // ==========================
  // КЕЙСЫ
  // Пока тестовые
  // Потом заменим на твои реальные
  // ==========================

  const interfaceCases = [

    {
      id: "i1",
      question: "Нужно посмотреть историю изменений файла в GitHub.",
      options: [
        "Code",
        "History",
        "Settings",
        "Issues"
      ],
      correctAnswer: "History"
    },

    {
      id: "i2",
      question: "Нужно создать новый файл в репозитории GitHub.",
      options: [
        "Add file",
        "Insights",
        "Security",
        "Star"
      ],
      correctAnswer: "Add file"
    },

    {
      id: "i3",
      question: "Нужно изменить существующий файл в GitHub.",
      options: [
        "Raw",
        "Edit this file",
        "Download",
        "Blame"
      ],
      correctAnswer: "Edit this file"
    },

    {
      id: "i4",
      question: "Нужно посмотреть все коммиты репозитория.",
      options: [
        "Commits",
        "Fork",
        "Projects",
        "Packages"
      ],
      correctAnswer: "Commits"
    },

    {
      id: "i5",
      question: "Нужно создать новый репозиторий.",
      options: [
        "New",
        "Pin",
        "Watch",
        "Tag"
      ],
      correctAnswer: "New"
    },

    {
      id: "i6",
      question: "Нужно открыть настройки репозитория.",
      options: [
        "Settings",
        "Pull requests",
        "Actions",
        "Wiki"
      ],
      correctAnswer: "Settings"
    },

    {
      id: "i7",
      question: "Нужно посмотреть опубликованный GitHub Pages.",
      options: [
        "Deployments",
        "Packages",
        "Contributors",
        "Releases"
      ],
      correctAnswer: "Deployments"
    },

    {
      id: "i8",
      question: "Нужно выбрать ветку main.",
      options: [
        "Branch selector",
        "Search",
        "Issues",
        "README"
      ],
      correctAnswer: "Branch selector"
    },

    {
      id: "i9",
      question: "Нужно сохранить изменения файла.",
      options: [
        "Commit changes",
        "Raw",
        "Preview",
        "Cancel"
      ],
      correctAnswer: "Commit changes"
    },

    {
      id: "i10",
      question: "Нужно посмотреть содержимое README.",
      options: [
        "README.md",
        "Actions",
        "Security",
        "Insights"
      ],
      correctAnswer: "README.md"
    }

  ];


  // ==========================
  // СОСТОЯНИЕ
  // ==========================

  let currentCase = null;

  let timerSeconds = 0;
  let timerInterval = null;


  // ==========================
  // ПРОГРЕСС
  // ==========================

  let progress = loadProgress();


  function loadProgress() {

    const saved =
      localStorage.getItem("rookieTrainerInterfaceProgress");

    if (saved) {
      return JSON.parse(saved);
    }

    return {};
  }


  function saveProgress() {

    localStorage.setItem(
      "rookieTrainerInterfaceProgress",
      JSON.stringify(progress)
    );

    updateHomeStats();
  }


  // ==========================
  // ЗАПУСК
  // ==========================

  function startTraining() {

    document
      .getElementById("home-screen")
      .classList.add("hidden");

    document
      .getElementById("case-screen")
      .classList.remove("hidden");

    nextCase();
  }


  // ==========================
  // ВЫБОР КЕЙСА
  // ==========================

  function nextCase() {

    resetCaseUI();

    let available = interfaceCases.filter(caseItem => {

      const data = progress[caseItem.id];

      if (!data) {
        return true;
      }

      return data.successCount < 3;
    });


    if (available.length === 0) {

      alert("Все кейсы закреплены 3 раза.");

      goHome();

      return;
    }


    const randomIndex =
      Math.floor(Math.random() * available.length);

    currentCase =
      available[randomIndex];

    showCase();

    startTimer();
  }


  // ==========================
  // ПОКАЗ КЕЙСА
  // ==========================

  function showCase() {

    document
      .getElementById("case-question")
      .textContent =
      currentCase.question;


    const data =
      progress[currentCase.id];


    const successCount =
      data ? data.successCount : 0;


    document
      .getElementById("case-progress")
      .textContent =
      successCount + " / 3";


    renderOptions();
  }


  // ==========================
  // ВАРИАНТЫ ОТВЕТОВ
  // ==========================

  function renderOptions() {

    const container =
      document.getElementById("interface-options");

    container.innerHTML = "";


    currentCase.options.forEach(option => {

      const button =
        document.createElement("button");

      button.textContent = option;

      button.onclick = function() {
        checkAnswer(option);
      };

      container.appendChild(button);

    });
  }


  // ==========================
  // ПРОВЕРКА
  // ==========================

  function checkAnswer(answer) {

    const isCorrect =
      answer === currentCase.correctAnswer;

    finishCase(isCorrect);
  }


  // ==========================
  // ЗАВЕРШЕНИЕ КЕЙСА
  // ==========================

  function finishCase(isCorrect) {

    stopTimer();


    if (!progress[currentCase.id]) {

      progress[currentCase.id] = {

        successCount: 0,

        attempts: 0,

        totalTime: 0,

        bestTime: null
      };
    }


    const data =
      progress[currentCase.id];


    data.attempts++;

    data.totalTime += timerSeconds;


    if (
      data.bestTime === null ||
      timerSeconds < data.bestTime
    ) {

      data.bestTime = timerSeconds;
    }


    if (isCorrect) {

      data.successCount++;

      if (data.successCount > 3) {
        data.successCount = 3;
      }
    }


    saveProgress();


    const result =
      document.getElementById("result-box");


    result.classList.remove("hidden");


    if (isCorrect) {

      result.innerHTML =
        "<strong>Верно.</strong><br>" +
        "Время: " +
        timerSeconds +
        " сек.<br>" +
        "Закрепление: " +
        data.successCount +
        " / 3";

    } else {

      result.innerHTML =
        "<strong>Ошибка.</strong><br>" +
        "Правильный ответ: " +
        currentCase.correctAnswer +
        "<br>" +
        "Время: " +
        timerSeconds +
        " сек.";
    }


    document
      .getElementById("next-case-btn")
      .classList.remove("hidden");
  }


  // ==========================
  // ТАЙМЕР
  // ==========================

  function startTimer() {

    timerSeconds = 0;

    document
      .getElementById("timer")
      .textContent =
      timerSeconds;


    timerInterval =
      setInterval(function() {

        timerSeconds++;

        document
          .getElementById("timer")
          .textContent =
          timerSeconds;

      }, 1000);
  }


  function stopTimer() {

    if (timerInterval) {

      clearInterval(timerInterval);

      timerInterval = null;
    }
  }


  // ==========================
  // СБРОС ЭКРАНА
  // ==========================

  function resetCaseUI() {

    stopTimer();

    document
      .getElementById("result-box")
      .classList.add("hidden");

    document
      .getElementById("next-case-btn")
      .classList.add("hidden");

    document
      .getElementById("interface-options")
      .innerHTML = "";
  }


  // ==========================
  // ГЛАВНАЯ
  // ==========================

  function goHome() {

    stopTimer();

    document
      .getElementById("case-screen")
      .classList.add("hidden");

    document
      .getElementById("home-screen")
      .classList.remove("hidden");

    updateHomeStats();
  }


  // ==========================
  // СТАТИСТИКА
  // ==========================

  function updateHomeStats() {

    const done =
      interfaceCases.filter(caseItem => {

        const data =
          progress[caseItem.id];

        return data &&
               data.successCount >= 3;

      }).length;


    document
      .getElementById("interface-progress")
      .textContent =
      done +
      " / " +
      interfaceCases.length;
  }


  updateHomeStats();

</script>

</body>
</html>
